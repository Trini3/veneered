# Backstop build only. Threads build and test before pushing, and this repo is private,
# so every minute here comes out of the account's shared 2,000 free minutes a month.
# Runs on: pull requests (not drafts, not docs-only), release tags (v*), and "Run workflow".
# Pushes straight to a branch never run it. See README "Known issues" > GitHub Actions.
name: Build

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '.gitignore'
      - '.gitattributes'
      - 'tools/**'
  push:
    tags: ['v*']
  workflow_dispatch:

# A newer push to the same PR cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write # only used by the tag step, to create the release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      # Only runs on the veneer branch (Run workflow) save the cache. PRs into veneer read it,
      # so they skip the Minecraft download without paying to upload a cache of their own.
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/veneer' }}

      # compileGametestJava catches a broken test mod; the sources jar is skipped to save time.
      - run: ./gradlew build compileGametestJava -x sourcesJar

      # Run workflow: the jar is a short-lived artifact on the run page.
      - if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: veneer-jar
          path: build/libs/veneer-*.jar
          if-no-files-found: error
          retention-days: 3

      # Release tag: attach the jar to a GitHub release instead (kept, no artifact storage).
      - if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/libs/veneer-*.jar --generate-notes --title "$GITHUB_REF_NAME"
